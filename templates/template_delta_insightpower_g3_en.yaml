              expression: 'last(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.output.source)=2'
              name: 'UPS Delta: Running on battery'
              priority: HIGH
              description: 'Utility power failed and the load is being supplied by the batteries.'
            - uuid: c53df179941e4395849eb01ba9fd77f9
