          tags:
            - tag: component
              value: inventory
        - uuid: 6d665444d11248bc81ce62522aa0b50f
          name: 'UPS: Rated apparent power'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.7.0
          key: 'ups.delta.rating.va'
          delay: 1h
          history: 30d
          units: VA
          tags:
            - tag: component
              value: inventory
        - uuid: 4f43c1e4fbcf427b861847c03ac12984
          name: 'Input: L1 frequency'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.4.2.0
          key: 'ups.delta.input.frequency.l1'
          delay: 1m
          history: 30d
          value_type: FLOAT
          units: Hz
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: input
          triggers:
            - uuid: 32d376a6f11c47008d12b12c0ce25410
              expression: 'max(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.input.frequency.l1,5m)>{$UPS.INPUT.FREQ.MAX} or min(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.input.frequency.l1,5m)<{$UPS.INPUT.FREQ.MIN}'
              name: 'UPS Delta: Input frequency out of range'
              priority: WARNING
        - uuid: 61fa9709e72a47ee8241d4759a436b93
