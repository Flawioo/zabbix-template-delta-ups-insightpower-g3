              expression: 'max(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.input.voltage.l1,5m)>{$UPS.INPUT.VOLTAGE.MAX} or min(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.input.voltage.l1,5m)<{$UPS.INPUT.VOLTAGE.MIN}'
              name: 'UPS Delta: Input voltage out of range'
              priority: WARNING
