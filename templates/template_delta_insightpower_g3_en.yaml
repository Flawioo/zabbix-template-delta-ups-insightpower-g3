      macros:
        - macro: '{$UPS.BATTERY.CAPACITY.MIN}'
          value: '30'
          description: 'Minimum battery charge percentage.'
        - macro: '{$UPS.INPUT.FREQ.MAX}'
          value: '63'
          description: 'Maximum acceptable input frequency in Hz.'
        - macro: '{$UPS.INPUT.FREQ.MIN}'
          value: '57'
          description: 'Minimum acceptable input frequency in Hz.'
        - macro: '{$UPS.INPUT.VOLTAGE.MAX}'
          value: '242'
          description: 'Maximum acceptable input voltage in V.'
        - macro: '{$UPS.INPUT.VOLTAGE.MIN}'
          value: '198'
          description: 'Minimum acceptable input voltage in V.'
        - macro: '{$UPS.LOAD.HIGH}'
          value: '95'
          description: 'Load percentage considered critical.'
        - macro: '{$UPS.LOAD.WARN}'
          value: '80'
          description: 'Load percentage warning threshold.'
        - macro: '{$UPS.RUNTIME.MIN}'
          value: '15'
          description: 'Minimum runtime in minutes while the UPS is on battery.'
      valuemaps:
