zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b963ccf207824a7b87a49c1f06a20e19
      name: 'Templates/Power equipment'
  templates:
    - uuid: 1181378bc7a84a2e888b84b3ac2907a2
      template: 'Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English'
      name: 'Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English'
      description: |
        Template for Delta UPS with InsightPower G3 Mini SNMP Card and sysObjectID .1.3.6.1.4.1.2254.2.5.
        Based on the proprietary Delta UPSv5 MIB. Numeric OIDs eliminate the need to install the MIB on the Zabbix server.
        Initially validated with model UPA302R2RX0B0B1, 3000 VA / 2700 W, single-phase.
        Configure the SNMP community on the host SNMP interface; no credentials are stored in this template.
      vendor:
        name: 4Firewall
        version: 1.0.1
      groups:
        - name: 'Templates/Power equipment'
      items:
        - uuid: 764ebd909b96454e85b47f67f31711a8
          name: 'SNMP: Availability'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'ups.delta.snmp.availability'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'sysObjectID returned by the card. Also used as an SNMP availability check.'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 0ba17eff19dc49f085072026e1ed6310
              expression: 'nodata(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP - English/ups.delta.snmp.availability,5m)=1'
              name: 'UPS Delta: No SNMP response for 5 minutes'
              priority: HIGH
              description: 'The InsightPower card stopped responding via SNMP.'
        - uuid: 68f3267bc1ac4f828faaf5e60010f5e0
          name: 'UPS: Manufacturer'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.1.0
          key: 'ups.delta.manufacturer'
          delay: 1h
          history: 30d
          trends: '0'
          value_type: CHAR
          inventory_link: VENDOR
          tags:
            - tag: component
              value: inventory
        - uuid: eb094b2731834a4e8d72d5ea14494e51
          name: 'UPS: Model'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.2.0
          key: 'ups.delta.model'
          delay: 1h
          history: 30d
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          tags:
            - tag: component
              value: inventory
        - uuid: 9ac9bc570335482787fb4ccda43aa148
          name: 'UPS: Firmware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.3.0
          key: 'ups.delta.firmware'
          delay: 1h
          history: 30d
          trends: '0'
          value_type: CHAR
          tags:
            - tag: component
              value: inventory
        - uuid: 8e58685f25dd425d836ff0319d865650
          name: 'SNMP card: Agent version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.4.0
          key: 'ups.delta.agent.version'
          delay: 1h
          history: 30d
