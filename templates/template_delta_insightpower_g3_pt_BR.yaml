      macros:
        - macro: '{$UPS.BATTERY.CAPACITY.MIN}'
          value: '30'
          description: 'Percentual minimo de carga da bateria.'
        - macro: '{$UPS.INPUT.FREQ.MAX}'
          value: '63'
          description: 'Frequencia maxima aceitavel na entrada, em Hz.'
        - macro: '{$UPS.INPUT.FREQ.MIN}'
          value: '57'
          description: 'Frequencia minima aceitavel na entrada, em Hz.'
        - macro: '{$UPS.INPUT.VOLTAGE.MAX}'
          value: '242'
          description: 'Tensao maxima aceitavel na entrada, em V.'
        - macro: '{$UPS.INPUT.VOLTAGE.MIN}'
          value: '198'
          description: 'Tensao minima aceitavel na entrada, em V.'
        - macro: '{$UPS.LOAD.HIGH}'
          value: '95'
          description: 'Percentual de carga considerado critico.'
        - macro: '{$UPS.LOAD.WARN}'
          value: '80'
          description: 'Percentual de carga para aviso.'
        - macro: '{$UPS.RUNTIME.MIN}'
          value: '15'
          description: 'Autonomia minima em minutos quando a UPS estiver em bateria.'
