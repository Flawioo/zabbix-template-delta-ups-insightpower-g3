                - '0.1'
          tags:
            - tag: component
              value: input
          triggers:
            - uuid: c2d376a6f11c47008d12b12c0ce25410
              expression: 'max(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP/ups.delta.input.frequency.l1,5m)>{$UPS.INPUT.FREQ.MAX} or min(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP/ups.delta.input.frequency.l1,5m)<{$UPS.INPUT.FREQ.MIN}'
              name: 'UPS Delta: Frequencia de entrada fora da faixa'
              priority: WARNING
        - uuid: 91fa9709e72a47ee8241d4759a436b93
