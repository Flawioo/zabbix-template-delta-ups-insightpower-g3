        - uuid: bf43c1e4fbcf427b861847c03ac12984
          name: 'Entrada: Frequencia L1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.4.2.0
          key: 'ups.delta.input.frequency.l1'
          delay: 1m
          history: 30d
          value_type: FLOAT
          units: Hz
          preprocessing:
            - type: MULTIPLIER
