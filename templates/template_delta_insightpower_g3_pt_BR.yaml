zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 4963ccf207824a7b87a49c1f06a20e19
      name: 'Templates/Power equipment'
  templates:
    - uuid: e181378bc7a84a2e888b84b3ac2907a2
      template: 'Delta UPS InsightPower G3 Mini SNMP Card by SNMP'
      name: 'Delta UPS InsightPower G3 Mini SNMP Card by SNMP'
      description: |
        Template para UPS Delta com placa InsightPower G3 Mini SNMP Card e sysObjectID .1.3.6.1.4.1.2254.2.5.
        Baseado na MIB proprietaria Delta UPSv5. OIDs numericos dispensam a instalacao da MIB no Zabbix.
        Validado inicialmente com o modelo UPA302R2RX0B0B1, 3000 VA / 2700 W, monofasico.
        Configure a comunidade SNMP na interface SNMP do host; nenhuma credencial e armazenada neste template.
      vendor:
        name: 4Firewall
        version: 1.0.1
      groups:
        - name: 'Templates/Power equipment'
      items:
        - uuid: 864ebd909b96454e85b47f67f31711a8
          name: 'SNMP: Availability'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: 'ups.delta.snmp.availability'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'sysObjectID retornado pela placa. Tambem funciona como teste de disponibilidade SNMP.'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: fba17eff19dc49f085072026e1ed6310
              expression: 'nodata(/Delta UPS InsightPower G3 Mini SNMP Card by SNMP/ups.delta.snmp.availability,5m)=1'
              name: 'UPS Delta: Sem resposta SNMP por 5 minutos'
              priority: HIGH
              description: 'A placa InsightPower deixou de responder via SNMP.'
        - uuid: 98f3267bc1ac4f828faaf5e60010f5e0
          name: 'UPS: Fabricante'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.1.0
          key: 'ups.delta.manufacturer'
          delay: 1h
          history: 30d
          trends: '0'
          value_type: CHAR
          inventory_link: VENDOR
          tags:
            - tag: component
              value: inventory
        - uuid: 1b094b2731834a4e8d72d5ea14494e51
          name: 'UPS: Modelo'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.2.0
          key: 'ups.delta.model'
          delay: 1h
          history: 30d
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          tags:
            - tag: component
              value: inventory
        - uuid: 6ac9bc570335482787fb4ccda43aa148
          name: 'UPS: Versao do firmware'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2254.2.5.1.3.0
          key: 'ups.delta.firmware'
          delay: 1h
